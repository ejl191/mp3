name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Google sign-in only works with the key whose SHA-1 is registered in Google Cloud,
      # so real builds need the SIGNING_KEYSTORE_BASE64 secret. Without it we still build
      # (to catch errors) with a throwaway key, but don't publish a release.
      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.MP3 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/driveplayer.jks
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set; signing with a throwaway key. Google sign-in will not work in this build."
            keytool -genkeypair -keystore keystore/driveplayer.jks -storepass driveplayer -keypass driveplayer \
              -alias driveplayer -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Throwaway"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -v -keystore keystore/driveplayer.jks -storepass driveplayer | grep -E "SHA1:"

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk DrivePlayer-${{ github.run_number }}.apk
          cp zorkapp/build/outputs/apk/release/zorkapp-release.apk Zork-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrivePlayer-${{ github.run_number }}
          path: DrivePlayer-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zork-${{ github.run_number }}
          path: Zork-${{ github.run_number }}.apk

      - name: Publish release
        if: steps.key.outputs.real == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Drive Player build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Built from `${{ github.ref_name }}` @ ${{ github.sha }}. Open this page on your phone and tap an APK to install it (DrivePlayer for audiobooks, Zork for the games).
          files: |
            DrivePlayer-${{ github.run_number }}.apk
            Zork-${{ github.run_number }}.apk
